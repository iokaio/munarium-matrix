[package]
name = "munarium-matrix-adapter-landing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Manifest-driven immutable snapshots from a landing zone (CSV/JSON). An export IS a snapshot."

[dependencies]
munarium-matrix-core = { workspace = true }
munarium-matrix-types = { workspace = true }
munarium-matrix-adapter = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
# Azure Blob (2026-08-30), the plan's WP-2.2 "object_store" transport — built
# because the estate's landing container and its managed-identity role
# assignment had existed since Phase 0 while nothing could read them, so the
# Phase 2 live scenario "manifest sync from blob via managed identity" could
# not run. The same crate and the same feature discipline as the server's
# munarium-store-objects: object_store's cloud client rides reqwest 0.13, whose
# `rustls` feature would hard-wire aws-lc-rs beside the workspace's ring;
# `rustls-no-provider` + `rustls/ring` keeps one crypto backend, and the
# binary installs it explicitly (`install_crypto_provider`).
object_store = { version = "0.14", default-features = false, features = ["azure-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
