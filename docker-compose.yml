# Matrix compose: its own Postgres role and schema, plus a fixture `crm`
# database that stands in for a customer system of record.
#
#   docker compose up -d postgres        -> just the database (what test.ps1 -Postgres needs)
#   docker compose up                    -> + munarium-matrix (ROLE=all)
#   docker compose --profile roles up    -> one container per role, for the isolation scenario
#   docker compose --profile server up   -> + a REAL munarium-server, so Matrix can be
#                                           tested against the peer instead of its mock
#
# The `crm` database carries RLS policies and TWO roles on purpose: a compliant
# `matrix_reader` and a deliberately non-compliant `matrix_bad_reader`, so the
# introspect refusal is exercised against a real database rather than a mock.
services:
  postgres:
    image: pgvector/pgvector:pg16
    # `wal_level=logical` is what makes a logical replication slot possible at
    # all (WP-6.8). It is set on the SERVICE rather than in an init script
    # because it is a startup parameter, not SQL — a database cannot turn it on
    # for itself. It costs a little extra WAL for every write, which is the
    # real price of CDC and is paid whether or not a slot exists.
    #
    # `max_replication_slots` and `max_wal_senders` keep their defaults (10),
    # which is ample for a fixture and is stated here so nobody has to go and
    # check whether the default is zero.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix-dev
      POSTGRES_DB: matrix
    # 5434: the server's compose already owns 5433 on a developer laptop.
    ports: ["5434:5432"]
    volumes:
      - matrixdata:/var/lib/postgresql/data
      # ONE init directory, read-only. `04-cube-fixture.sql` (the Cube
      # upstream) lives here rather than beside the Cube model because
      # Postgres runs only what is in this directory, and mounting a single
      # file INTO a bind-mounted directory makes Docker create the mountpoint
      # in the SOURCE tree -- it left an empty `04-cube-fixture.sql` in git
      # the one time that was tried. `05-cdc-fixture.sql` joined it for
      # WP-6.8, and the same rule bites: Postgres runs this directory ONLY
      # on an empty data dir, so an existing `matrixdata` volume will not
      # pick up a new file. `docker compose down -v` once after pulling a
      # change here, or the cdc tier refuses `cdc_publication_missing` and
      # looks like a code defect.
      # the one time that was tried. Until 2026-08-30 the cube fixture was
      # mounted nowhere at all, and the cube scenarios passed only because a
      # hand-run psql had once loaded it; a fresh volume disproved them.
      - ./fixtures/t0/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix"]
      interval: 3s
      timeout: 3s
      retries: 20

  munarium-matrix:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MUNARIUM_MATRIX_ROLE: all
      MUNARIUM_MATRIX_DATABASE_URL: postgres://matrix_owner:matrix-owner-dev@postgres:5432/matrix
      MUNARIUM_MATRIX_AUTH_MODE: static
      MUNARIUM_MATRIX_STATIC_TOKENS: "mxdev:tenant-default:rw,mxmgmt:tenant-default:mgmt"
      MUNARIUM_MATRIX_LOG: info
      # The seal peer. Sealing needs a server, and a role that seals cannot
      # run without one -- so the tiers that execute a contract (the `grpc`
      # tier among them) need the `server` profile up AND this pointed at it:
      #
      #   $env:MUNARIUM_MATRIX_COMPOSE_SERVER_URL = "http://munarium-server:8080"
      #   docker compose --profile server up -d                 # the pinned release image
      #
      # Empty by default, because an empty value reads as UNSET (config.rs
      # filters blanks) and a plain `docker compose up` still needs no second
      # service. Left unset, an execute refuses `source_unavailable` naming
      # this variable, which is the honest answer rather than a green test.
      MUNARIUM_MATRIX_SERVER_URL: ${MUNARIUM_MATRIX_COMPOSE_SERVER_URL:-}
      MUNARIUM_MATRIX_SERVER_TOKEN_REF: env:MUNARIUM_MATRIX_COMPOSE_SEAL_TOKEN
      # A server token scoped to MATRIX'S tenant, and that is not incidental:
      # an evidence manifest DECLARES its tenant, and the server refuses a
      # manifest whose tenant is not the one the bearer token is scoped to.
      # The live-test token (mxserver-rw / matrix-live) is a different tenant
      # on purpose, so the two tiers cannot read each other's evidence.
      MUNARIUM_MATRIX_COMPOSE_SEAL_TOKEN: mxseal-rw
      MUNARIUM_MATRIX_TARGET_SERVER_VERSION: "0.5.0"
      # The `crm` source's credential, resolved by `credentialRef: matrix-crm`
      # (a bare name reads MUNARIUM_MATRIX_SECRET_<NAME>). `matrix_reader` is
      # the row-level-secured role the fixture defines: it sees EMEA only, so
      # the compose tier measures the same restricted view the estate does.
      MUNARIUM_MATRIX_SECRET_MATRIX_CRM: postgres://matrix_reader:matrix-reader-dev@postgres:5432/matrix
    ports:
      - "${MUNARIUM_MATRIX_HOST_HTTP:-8180}:8180"
      - "${MUNARIUM_MATRIX_HOST_OPS:-9190}:9190"
      # The gRPC data plane (Phase 6). h2c here; TLS is the ingress's job.
      - "${MUNARIUM_MATRIX_HOST_GRPC:-50151}:50151"

  # --- server profiles: the COMPOSE tier's test server -----------------------
  #
  # The plan's compose tier says "a compose-launched test server", and this is
  # it. It exists because `MockServer` accepted request shapes the real server
  # rejects, and four defects rode that gap all the way to a hand-run live
  # test. A double is a claim about a peer; this service is where the claim
  # gets checked, for $0, on every push.
  #
  # Two profiles, one environment (phase 2 of the commercial repository plan,
  # 2026-09-03). `server` PULLS the pinned release image named in
  # deploy/SERVER_IMAGE -- the only form a standalone Matrix checkout has, and
  # what matrix-server-contract.yml runs on main. `server-source` BUILDS
  # published one; it exists only where the server tree is a sibling (this
  # monorepo), the contract workflow uses it on pull requests, and it answers
  # to the same name on the network so MUNARIUM_MATRIX_COMPOSE_SERVER_URL is
  # the same either way. Ground rule 1 is about CRATE dependencies -- running
  # a peer's binary in a test is not a dependency edge, and `cargo tree` stays
  # clean. The image default below must equal deploy/SERVER_IMAGE; test.ps1
  # checks that they agree.
  munarium-server:
    profiles: ["server"]
    image: ${MUNARIUM_SERVER_IMAGE:-<licensee registry>/munarium-server@sha256:3e0c50be2167c659c60d389d99a1b7c1c1f6e0ef93de9c952ef2db91779f177c}
    depends_on:
      postgres:
        condition: service_healthy
    environment: &munarium-server-env
      MUNARIUM_HTTP_ADDR: 0.0.0.0:8080
      MUNARIUM_GRPC_ADDR: disabled
      MUNARIUM_OPS_ADDR: 0.0.0.0:9090
      MUNARIUM_STORE: postgres
      MUNARIUM_SOURCE_STORE: pg
      MUNARIUM_DATABASE_URL: postgres://matrix:matrix-dev@postgres:5432/munarium
      MUNARIUM_AUTH_MODE: static
      # rw for the data plane, mgmt for retention. The tenant matches
      # MUNARIUM_MATRIX_LIVE_TENANT in the Matrix live tests.
      MUNARIUM_STATIC_TOKENS: "mxserver-rw:matrix-live:rw,mxserver-mgmt:matrix-live:mgmt,mxseal-rw:tenant-default:rw"
      MUNARIUM_TOKEN_SECRET: "compose-matrix-tier-secret-32-bytes!"
      MUNARIUM_REQUIRE_UID: "true"
      # The retention janitor stays OFF here. A sweep firing mid-suite would
      # delete an artifact a test was about to read, and the janitor has its
      # own deterministic coverage in the server's own tests.
      MUNARIUM_EVIDENCE_PURGE_INTERVAL_SECS: "0"
      # The structured-evidence plane, so a runbook with data views can run
      # its verifyDataViews step and a turn can execute through a research
      # profile HERE, for $0 (2026-08-30: the §18.3 harness rehearses its
      # turn half against this before it costs an estate cycle). The token is
      # Matrix's rw token for the tenant the seal token above belongs to.
      MUNARIUM_MATRIX_BASE_URL: http://munarium-matrix:8180
      MUNARIUM_MATRIX_TOKEN: mxdev
    ports:
      - "${MUNARIUM_SERVER_HOST_HTTP:-18080}:8080"
    # No healthcheck: the image is distroless-static and has neither a shell
    # nor wget, so the one that used to be here never passed and the container
    # sat "unhealthy" while serving perfectly (found 2026-08-29). The test
    # runner waits on /healthz from the host instead.


  # --- role profile: proves the pools are genuinely separate ----------------
  matrix-control:
    profiles: ["roles"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MUNARIUM_MATRIX_ROLE: control
      MUNARIUM_MATRIX_DATABASE_URL: postgres://matrix_owner:matrix-owner-dev@postgres:5432/matrix
      MUNARIUM_MATRIX_AUTH_MODE: static
      MUNARIUM_MATRIX_STATIC_TOKENS: "mxdev:tenant-default:rw,mxmgmt:tenant-default:mgmt"
    ports: ["8181:8180"]

  matrix-query:
    profiles: ["roles"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MUNARIUM_MATRIX_ROLE: query
      MUNARIUM_MATRIX_DATABASE_URL: postgres://matrix_owner:matrix-owner-dev@postgres:5432/matrix
      MUNARIUM_MATRIX_AUTH_MODE: static
      MUNARIUM_MATRIX_STATIC_TOKENS: "mxdev:tenant-default:rw"
    ports: ["8182:8180"]

  matrix-sync:
    profiles: ["roles"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MUNARIUM_MATRIX_ROLE: sync
      MUNARIUM_MATRIX_DATABASE_URL: postgres://matrix_owner:matrix-owner-dev@postgres:5432/matrix
      MUNARIUM_MATRIX_AUTH_MODE: static
      MUNARIUM_MATRIX_STATIC_TOKENS: "mxdev:tenant-default:rw"
    ports: ["8183:8180"]

  matrix-reconcile:
    profiles: ["roles"]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MUNARIUM_MATRIX_ROLE: reconcile
      MUNARIUM_MATRIX_DATABASE_URL: postgres://matrix_owner:matrix-owner-dev@postgres:5432/matrix
      MUNARIUM_MATRIX_AUTH_MODE: static
      MUNARIUM_MATRIX_STATIC_TOKENS: "mxdev:tenant-default:rw"
    ports: ["8184:8180"]

  # WP-6.8: a real MySQL 8, for the second SQL engine behind the adapter
  # seam. Its fixture mirrors the Postgres one closely enough to compare and
  # differs where the ENGINES differ — which is the point of the tier.
  mysql:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: matrix-root-dev
      MYSQL_DATABASE: crm
      MYSQL_USER: matrix
      MYSQL_PASSWORD: matrix-dev
    command: ["--sql-mode=STRICT_ALL_TABLES"]
    volumes:
      - ./fixtures/mysql:/docker-entrypoint-initdb.d:ro
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pmatrix-root-dev"]
      interval: 5s
      timeout: 5s
      retries: 30

  # WP-6.2: a real Cube deployment for the semantic-provider tier. Its
  # schema lives beside this file and is mounted read-only; the same Postgres
  # the estate uses is the upstream, so a query answered here is answered from
  # the fixture the rest of the suite already trusts.
  cube:
    profiles: ["cube"]
    image: cubejs/cube:v1.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: matrix
      CUBEJS_DB_USER: matrix
      CUBEJS_DB_PASS: matrix-dev
      CUBEJS_API_SECRET: cube-dev-secret
      CUBEJS_TELEMETRY: "false"
    volumes:
      - ./fixtures/cube/model:/cube/conf/model:ro
    ports: ["4000:4000"]
    healthcheck:
      # `node`, not `curl`: the cubejs image has no curl, so this check could
      # never pass and the service sat "unhealthy" while serving perfectly.
      # The same species as the compose server's `wget` check, found the same
      # way — by looking at a container that worked and was marked broken.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:4000/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" 
      interval: 5s
      timeout: 5s
      retries: 30

  # WP-6.8: a real SQL Server 2022, for the third SQL engine behind the adapter
  # seam. Unlike the postgres and mysql images this one runs no init directory,
  # so the entrypoint below starts the engine, waits for it to ANSWER (an ARM
  # container that is "up" is still seconds short of accepting a login), applies
  # the fixture and then hands the process back. The healthcheck counts rows in
  # the fixture's own table rather than pinging: a ping proves the engine is
  # alive and says nothing about whether the fixture loaded, and a tier that
  # starts against an empty database fails in a way that looks like a bug in the
  # adapter.
  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # A developer-local password. It is complex because SQL Server refuses to
      # start otherwise, not because it is protecting anything.
      MSSQL_SA_PASSWORD: "Matrix-Dev-Passw0rd!"
      MSSQL_PID: Developer
    volumes:
      - ./fixtures/sqlserver:/fixtures:ro
    # 14330: 1433 is what a developer's own SQL Server would already own.
    ports: ["14330:1433"]
    entrypoint:
      - /bin/bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        engine=$$!
        for _ in $$(seq 1 60); do
          if /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -l 2 -Q "SELECT 1" >/dev/null 2>&1; then break; fi
          sleep 2
        done
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /fixtures/01-crm-fixture.sql
        wait $$engine
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d crm -b -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.opportunities' > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60

volumes:
  matrixdata:
