# A host of real-world length. Azure Postgres FQDNs run to ~47 characters and
# Azure Databricks hosts to ~44, and until 2026-08-29 the secret heuristic
# refused any connection value over 40 — so this exact asset was refused on
# the estate at `spec.connection.host` with `credential.literal`, and no Azure
# source could have been registered on a deployed Matrix. Every other valid
# fixture uses a short host, which is why only the estate found it.
apiVersion: munarium.ioka.io/v1
kind: DataSource
metadata:
  name: crm-azure
  version: 1
spec:
  adapter: postgres
  connection:
    host: psql-mxtest-ejl8keln.postgres.database.azure.com
    database: crm
    schema: crm
  credentialRef: mxtest-crm
  egress:
    allowHosts: [psql-mxtest-ejl8keln.postgres.database.azure.com]
  authorization:
    strategy: source_native
