# The Cube model the WP-6.2 tier queries. It is deliberately tiny and it is
# CUBE's, not Matrix's: these measure definitions are the thing Matrix must
# NOT duplicate. The upstream table is created by the tier's own setup so the
# model has something to read.
cubes:
  - name: Orders
    sql_table: cube_fixture.orders
    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
      - name: status
        sql: status
        type: string
      - name: region
        sql: region
        type: string
    measures:
      - name: count
        type: count
      - name: totalAmount
        sql: amount
        type: sum
